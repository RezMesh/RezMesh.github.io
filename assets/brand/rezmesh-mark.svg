<svg xmlns="http://www.w3.org/2000/svg" viewBox="-84 -84 168 168" role="img" aria-labelledby="title desc">
<title id="title">RezMesh mark</title>
<desc id="desc">A geometric mesh of connected nodes forming a resilient network symbol.</desc>
<defs>
  <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
