name: Deploy RezMesh static site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/home.js
          node scripts/validate-static-site.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          cp index.html 404.html robots.txt sitemap.xml _site/
          touch _site/.nojekyll

          for dir in \
            assets \
            how-it-works \
            emergency-communication \
            power-management \
            scenarios \
            about-rezmesh \
            bound-method \
            contact \
            fa \
            ar
          do
            test -d "$dir"
            cp -R "$dir" _site/
          done

          test -f _site/index.html
          test -f _site/fa/index.html
          test -f _site/ar/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
