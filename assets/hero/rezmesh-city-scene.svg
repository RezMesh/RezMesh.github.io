<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">RezMesh cinematic city scene</title>
<desc id="d">A dark city at dusk with four ordinary people holding phones in the foreground, designed for animated communication overlays.</desc>
<defs>
  <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#07111a"/>
    <stop offset=".52" stop-color="#0d1b27"/>
    <stop offset="1" stop-color="#172531"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" x2="1">
    <stop offset="0" stop-color="#5fd4c0" stop-opacity=".02"/>
    <stop offset=".55" stop-color="#c8d9e6" stop-opacity=".06"/>
    <stop offset="1" stop-color="#e8a33d" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="street" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#122331"/>
    <stop offset="1" stop-color="#071018"/>
  </linearGradient>
  <radialGradient id="lamp">
    <stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/>
    <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur9"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>

<rect width="1440" height="900" fill="url(#sky)"/>
<ellipse cx="1110" cy="320" rx="370" ry="250" fill="#5fd4c0" opacity=".035" filter="url(#blur24)"/>
<ellipse cx="350" cy="360" rx="420" ry="270" fill="#9fb4c7" opacity=".035" filter="url(#blur24)"/>
<rect width="1440" height="900" fill="url(#haze)"/>

<!-- distant skyline -->
<g fill="#132331">
  <path d="M0 610V430h92v180zM76 610V375h88v235zM148 610V455h92v155zM224 610V330h122v280zM328 610V405h82v205zM392 610V290h130v320zM505 610V438h98v172zM588 610V346h140v264zM712 610V420h100v190zM798 610V315h118v295zM902 610V390h96v220zM984 610V280h132v330zM1098 610V365h104v245zM1180 610V320h126v290zM1286 610V410h154v200z"/>
</g>
<g fill="#20394b" opacity=".78">
  <path d="M30 610V512h70v98zM188 610V510h64v100zM360 610V480h92v130zM545 610V505h76v105zM742 610V496h78v114zM936 610V500h70v110zM1130 610V490h84v120zM1320 610V500h80v110z"/>
</g>

<!-- windows -->
<g fill="#ffd98a" opacity=".22">
  <rect x="242" y="360" width="8" height="13"/><rect x="268" y="360" width="8" height="13"/><rect x="294" y="360" width="8" height="13"/>
  <rect x="420" y="330" width="8" height="13"/><rect x="448" y="330" width="8" height="13"/><rect x="476" y="330" width="8" height="13"/>
  <rect x="624" y="390" width="8" height="13"/><rect x="652" y="390" width="8" height="13"/><rect x="680" y="390" width="8" height="13"/>
  <rect x="826" y="350" width="8" height="13"/><rect x="854" y="350" width="8" height="13"/><rect x="882" y="350" width="8" height="13"/>
  <rect x="1020" y="330" width="8" height="13"/><rect x="1048" y="330" width="8" height="13"/><rect x="1076" y="330" width="8" height="13"/>
  <rect x="1210" y="360" width="8" height="13"/><rect x="1238" y="360" width="8" height="13"/><rect x="1266" y="360" width="8" height="13"/>
</g>

<!-- atmospheric lamps -->
<g>
  <circle cx="192" cy="575" r="64" fill="url(#lamp)" opacity=".18" filter="url(#blur9)"/>
  <circle cx="520" cy="555" r="78" fill="url(#lamp)" opacity=".15" filter="url(#blur9)"/>
  <circle cx="980" cy="565" r="72" fill="url(#lamp)" opacity=".14" filter="url(#blur9)"/>
  <circle cx="1270" cy="540" r="64" fill="url(#lamp)" opacity=".18" filter="url(#blur9)"/>
</g>

<!-- street -->
<path d="M0 610 C320 575 1110 580 1440 620V900H0Z" fill="url(#street)"/>
<path d="M0 708 C360 675 1060 680 1440 716" fill="none" stroke="#40505a" stroke-opacity=".18" stroke-width="3"/>
<path d="M0 760 C350 735 1080 744 1440 776" fill="none" stroke="#40505a" stroke-opacity=".12" stroke-width="2"/>

<!-- phone users -->
<g fill="#071018" stroke="#263746" stroke-width="2">
  <g transform="translate(430 635)">
    <circle cx="0" cy="-66" r="24"/><path d="M-38 55Q-31-36 0-39Q33-37 39 55Z"/>
    <path d="M-28 9Q-53 26-49 57" fill="none"/><path d="M28 6Q48 17 54 44" fill="none"/>
    <rect x="44" y="6" width="19" height="34" rx="4" fill="#d9f8ff" stroke="#5fd4c0"/>
  </g>
  <g transform="translate(640 677)">
    <circle cx="0" cy="-61" r="22"/><path d="M-34 48Q-28-34 0-36Q30-33 36 48Z"/>
    <path d="M-26 0Q-50 14-53 40" fill="none"/>
    <rect x="-66" y="6" width="18" height="31" rx="4" fill="#d9f8ff" stroke="#5fd4c0"/>
  </g>
  <g transform="translate(842 640)">
    <circle cx="0" cy="-67" r="24"/><path d="M-38 55Q-31-37 0-39Q33-37 39 55Z"/>
    <path d="M29 4Q52 18 56 45" fill="none"/>
    <rect x="49" y="6" width="19" height="34" rx="4" fill="#d9f8ff" stroke="#5fd4c0"/>
  </g>
  <g transform="translate(1056 678)">
    <circle cx="0" cy="-60" r="22"/><path d="M-34 48Q-28-34 0-36Q30-33 36 48Z"/>
    <path d="M-26 2Q-49 15-52 41" fill="none"/>
    <rect x="-65" y="7" width="18" height="31" rx="4" fill="#d9f8ff" stroke="#5fd4c0"/>
  </g>
</g>

<!-- subtle foreground silhouettes -->
<g fill="#050b10" opacity=".72">
  <path d="M0 900V740h180l80 160z"/><path d="M1440 900V715h-210l-95 185z"/>
</g>

<!-- reflections -->
<g opacity=".18" filter="url(#soft)">
  <path d="M492 684l16 180" stroke="#5fd4c0" stroke-width="10"/>
  <path d="M575 722l-12 142" stroke="#5fd4c0" stroke-width="8"/>
  <path d="M898 687l15 177" stroke="#5fd4c0" stroke-width="10"/>
  <path d="M996 722l-10 142" stroke="#5fd4c0" stroke-width="8"/>
</g>
</svg>